  var Layers = icon("M12 3 2 8l10 5 10-5-10-5zM2 14l10 5 10-5M2 11l10 5 10-5");

  // =====================================================================

  function AppRoot() {
    var _session = React.useState(undefined); var session = _session[0], setSession = _session[1]; // undefined = checking, null = signed out

    var _roleLoading = React.useState(false); var roleLoading = _roleLoading[0], setRoleLoading = _roleLoading[1];
    var _roleError = React.useState(""); var roleError = _roleError[0], setRoleError = _roleError[1];

    React.useEffect(function () {

      setRoleError("");
      sb.from("user_roles").select("role").eq("user_id", session.user.id).maybeSingle()
        .then(function (res) {
